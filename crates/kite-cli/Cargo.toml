[package]
name = "kite-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
kite-core = { version = "0.1.0", path = "../kite-core" }
kite-proto = { version = "0.1.0", path = "../kite-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = { version = "3.0.0", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "kite"
path = "src/main.rs"
