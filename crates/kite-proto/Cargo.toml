[package]
name = "kite-proto"
description = "Kite's message contracts: envelopes, schemas, kite.toml and the wire protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
jsonschema = { version = "0.59.0", default-features = false, features = ["idna"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
ulid = { version = "3.0.0", features = ["serde"] }
