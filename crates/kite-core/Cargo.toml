[package]
name = "kite-core"
description = "Kite's broker, hash-chained ledger, agent board, supervisor and client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
hex = "0.4.3"
kite-proto = { version = "0.2.0", path = "../kite-proto" }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
ulid = { version = "3.0.0", features = ["serde"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full", "test-util"] }
