[package]
name = "kite-core"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
kite-proto = { version = "0.1.0", path = "../kite-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
ulid = { version = "3.0.0", features = ["serde"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full", "test-util"] }
